services:
  pipeline:
    build: ./pipeline
    env_file: .env
    environment:
      - CSV_PATH=/data/leads.csv
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  landing:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pipeline:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

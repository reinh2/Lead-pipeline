services:
  pipeline:
    build: ./pipeline
    env_file: .env
    environment:
      - CSV_PATH=/data/leads.csv
      - TRUSTED_PROXY_CIDRS=172.16.0.0/12
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m

  landing:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pipeline:
        condition: service_healthy
    healthcheck:
      # nginx in this read-only container listens on IPv4; localhost may
      # resolve to ::1 first and incorrectly mark a healthy landing as down.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
